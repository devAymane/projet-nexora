services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora_app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nexora_db
      DB_USERNAME: nexora
      DB_PASSWORD: nexora_password

      QUEUE_CONNECTION: database

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: nexora_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: nexora_db
      MYSQL_USER: nexora
      MYSQL_PASSWORD: nexora_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - nexora_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexora_mysql_data: